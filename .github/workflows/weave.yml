name: Weave the carpet

# Reweaves assets/carpet.svg from the live contribution calendar with Haly
# (https://github.com/DovletEmin/haly). One gul per day; the dye levels are
# recomputed from the real distribution. Identical data gives a byte-identical
# file, so a quiet day commits nothing.

on:
  schedule:
    - cron: '17 4 * * *'      # every morning, 04:17 UTC
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/weave.yml'

permissions:
  contents: write

jobs:
  weave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DovletEmin/haly@v1
        with:
          outputs: assets/carpet.svg
          # A classic PAT with read:user also counts private contributions.
          # Without the secret, the default token weaves public ones.
          github_token: ${{ secrets.WEAVE_TOKEN || github.token }}

      - name: Commit if the weave changed
        run: |
          if git diff --quiet -- assets/carpet.svg; then
            echo "No change today."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/carpet.svg
          git commit -m 'Reweave the carpet'
          git push
