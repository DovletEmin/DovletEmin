name: Weave the carpet

# Reweaves assets/carpet.svg from the live contribution calendar.
# Each knot is one day; the dye scale is recomputed from the real distribution.

on:
  schedule:
    - cron: '17 4 * * *'      # every morning, 04:17 UTC
  workflow_dispatch:
  push:
    paths:
      - 'assets/src/**'
      - '.github/workflows/weave.yml'

permissions:
  contents: write

jobs:
  weave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fonttools
        run: pip install --quiet fonttools

      - name: Fetch the typefaces
        working-directory: assets/src
        run: |
          mkdir -p fonts
          curl -sSLf -o fonts/Archivo-var.ttf \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/archivo/Archivo%5Bwdth%2Cwght%5D.ttf'
          curl -sSLf -o fonts/IBMPlexMono-Medium.ttf \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexmono/IBMPlexMono-Medium.ttf'

      - name: Read the contribution calendar
        working-directory: assets/src
        env:
          # A classic PAT with read:user is the reliable path. Without the
          # secret this falls back to GITHUB_TOKEN, which may return nothing.
          GH_TOKEN: ${{ secrets.WEAVE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql -F login="${{ github.repository_owner }}" -f query='
            query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  totalCommitContributions
                  totalRepositoriesWithContributedCommits
                  contributionCalendar {
                    totalContributions
                    weeks { contributionDays { date contributionCount } }
                  }
                }
              }
            }' > contrib.json
          python -c "import json,sys; d=json.load(open('contrib.json'))['data']['user']; \
            sys.exit('empty calendar' if not d['contributionsCollection']['contributionCalendar']['totalContributions'] else 0)"

      - name: Weave
        working-directory: assets/src
        run: python carpet.py contrib.json ../carpet.svg

      - name: Commit if the weave changed
        run: |
          if git diff --quiet -- assets/carpet.svg; then
            echo "No change today."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/carpet.svg
          git commit -m 'Reweave the carpet'
          git push
